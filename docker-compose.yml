services:
  postgres:
    image: postgres:16
    container_name: recovery_agent_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: recovery_agent
      POSTGRES_USER: sanju
      POSTGRES_PASSWORD: sanjupass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
