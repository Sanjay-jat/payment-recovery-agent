services:
  postgres:
    image: postgres:16
    container_name: recovery_agent_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: recovery_agent
      POSTGRES_USER: sanju
      POSTGRES_PASSWORD: sanjupass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanju"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: recovery_agent_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sanju:sanjupass@postgres:5432/recovery_agent
      LLM_PROVIDER: gemini
      OPERATOR_TOKEN: 12345
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: recovery_agent_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata: